name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make -C live/tests/native check

  style:
    name: Kernel style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check 3DS C formatting
        run: |
          find sysmod/source sysmod/include app/source codec/source codec/include \
            -type f \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0 clang-format --dry-run --Werror --style=file

  build-3ds:
    name: 3DS sysmodule + launcher
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install libctru and 3DS tools
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev
      - name: Build sysmodule and launcher
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make -C sysmod LIVE_FRAME_TIMING=0
          make -C app
      - name: Stage artifacts
        run: |
          mkdir -p dist/SD/3ds/3ds-live dist/SD/luma/sysmodules
          cp app/3ds-live.3dsx dist/3ds-live.3dsx
          cp app/build/3ds-live.cia dist/3ds-live.cia
          cp app/3ds-live.3dsx dist/SD/3ds/3ds-live/3ds-live.3dsx
          cp live/config/live.ini.example dist/SD/3ds/3ds-live/live.ini.example
          cp sysmod/3dslive.cxi dist/SD/luma/sysmodules/0004013000F1D402.cxi
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds
          path: dist
          if-no-files-found: error

  build-android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: android
        run: flutter pub get
      - name: Analyze and test
        working-directory: android
        run: |
          flutter analyze
          flutter test
      - name: Build APK
        working-directory: android
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=APP_VERSION="$(cat ../VERSION)"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/3DS-Live-$(cat ../VERSION)-Android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
